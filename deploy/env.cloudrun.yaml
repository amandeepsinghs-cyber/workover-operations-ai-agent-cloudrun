# WellPulse v0.4 Cloud Run environment (SDD §17.2). Used with `--env-vars-file`, which REPLACES
# every existing env var on the service — this is how the legacy GEMINI_API_KEY is removed.
# No API keys: Vertex AI via the runtime service account (ADC).
# Explicit WELLPULSE_* vars win over GOOGLE_CLOUD_PROJECT everywhere in the code.

# --- Vertex AI (ADC) ---------------------------------------------------------
GOOGLE_GENAI_USE_VERTEXAI: "true"
GOOGLE_CLOUD_PROJECT: "workover-operations-agentic-ai"
# Text model gemini-3.8-flash generate_content works only in `global` (D-13; 404 in us-central1).
GOOGLE_CLOUD_LOCATION: "global"

# --- Text model (D-13) -------------------------------------------------------
WELLPULSE_TEXT_MODEL: "gemini-3.8-flash"
WELLPULSE_TEXT_LOCATION: "global"
WELLPULSE_TEXT_PROJECT: "workover-operations-agentic-ai"
TEXT_MODEL: "gemini-3.8-flash"

# --- Gemini Live (Stage U, SDD §11.7; verified gemini-3.8-live@us-central1) ---
WELLPULSE_LIVE_MODEL: "gemini-3.8-live"
WELLPULSE_LIVE_LOCATION: "us-central1"
WELLPULSE_LIVE_PROJECT: "workover-operations-agentic-ai"
WELLPULSE_LIVE_VOICE: "Aoede"
LIVE_MODEL: "gemini-3.8-live"
LIVE_LOCATION: "us-central1"

# --- Data (SDD §5.7, D-15) ---------------------------------------------------
DATA_BACKEND: "parquet"
AS_OF: "2026-09-23"
# BigQuery (only used when DATA_BACKEND=bigquery)
WELLPULSE_BQ_PROJECT: "workover-operations-agentic-ai"
WELLPULSE_BQ_LOCATION: "asia-south1"
WELLPULSE_BQ_SILVER_DATASET: "wellpulse_silver"
BQ_LOCATION: "asia-south1"
GCS_DATA_LAKE_BUCKET: "workover-operations-agentic-ai-datalake"
