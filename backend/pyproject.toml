[project]
name = "wellpulse-backend"
version = "0.4.0"
description = "WellPulse FastAPI backend (well operations intelligence & voice copilot)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "google-genai>=0.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "uvicorn[standard]>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
