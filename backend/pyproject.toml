[project]
name = "wellpulse-backend"
version = "0.4.0"
description = "WellPulse FastAPI backend (well operations intelligence & voice copilot)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "google-adk>=2.11.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "google-cloud-storage>=2.16",
    "google-genai>=0.1",
    "lifelines==0.30.3",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "pyarrow==25.0.1",
    "pydantic>=2.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.1",
    "requests>=2.31",
    "scikit-learn>=1.9.1",
    "scipy==1.17.1",
    "uvicorn[standard]>=0.28",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live_llm: calls the real gemini-3.8-flash on Vertex AI (run with WELLPULSE_LIVE_LLM=1)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-bdd>=9.0.0",
    "ruff>=0.16.10",
]
